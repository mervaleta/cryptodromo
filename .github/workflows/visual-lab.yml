name: Cinematic visual lab verification
on:
  push:
    branches: [main]
    paths: ['visual-lab/**','race-lab/source/src/horse.js','race-lab/source/src/horseLivery.js','race-lab/source/src/horseSurface.js','race-lab/source/src/gaitRefiner.js','assets/crypto-logos/**','racers/**','tests/visual-lab-browser.mjs','tests/cinematic-choreography.mjs','tests/race-broadcast.mjs','tests/alpha07-visual.mjs','tests/alpha08.mjs','tests/alpha09.mjs','tests/alpha11-oval.mjs','tests/alpha12-curve-contact.mjs','tests/finish-browser.mjs','.github/workflows/visual-lab.yml']
  workflow_dispatch:
concurrency:
  group: visual-lab-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Parse all browser modules
        run: |
          node --check visual-lab/scene.js
          node --check visual-lab/cinematicCamera.js
          node --check visual-lab/nightLights.js
          node --check visual-lab/raceChoreography.js
          node --check visual-lab/raceAudio.js
          node --check visual-lab/raceBroadcast.js
          node --check visual-lab/rosterStats.js
          node --check race-lab/source/src/gaitRefiner.js
          node --check race-lab/source/src/horse.js
          node --check race-lab/source/src/horseLivery.js
          node --check visual-lab/trackSurface.js
          node --check visual-lab/liveSchedule.js
          node --check visual-lab/broadcastTimeline.js
          node --check visual-lab/trackMath.js
          node --check visual-lab/trackVisuals.js
          node --check race-lab/source/src/horseSurface.js
      - name: Verify eight-pose gallop, race runout, narration and 100 runner careers
        run: node --test tests/race-broadcast.mjs
      - name: Verify 47 local logos, dyed material, hoofprints and official fade-in
        run: node --test tests/alpha07-visual.mjs
      - name: Verify Alpha08 three course layouts, LIVE calendar and shader upgrades
        run: node --test tests/alpha08.mjs
      - name: Verify Alpha09 180-second LIVE loop, 3360 last-runner finishes and rain effects
        run: node --test tests/alpha09.mjs
      - name: Verify Alpha11 oval lane geometry
        run: node --test tests/alpha11-oval.mjs
      - name: Verify Alpha12 curved-track dust and finish stripe
        run: node --test tests/alpha12-curve-contact.mjs
      - name: Verify financial outcome and all 3360 choreographed races
        run: node --test tests/cinematic-choreography.mjs
      - name: Verify live cinematic scene
        run: node tests/visual-lab-browser.mjs
      - name: Verify live official finish after 60s and overlay
        run: node tests/finish-browser.mjs
      - name: Save reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptodromo-cinematic-alpha09
          path: artifacts/
          if-no-files-found: ignore
