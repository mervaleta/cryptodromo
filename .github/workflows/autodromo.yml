name: Autodromo Crypto contract
on:
  pull_request:
    paths:
      - 'autodromo/**'
      - 'tests/autodromo.mjs'
      - 'race-lab/source/src/data/**'
      - 'visual-lab/tripleLiveSchedule.js'
      - '.github/workflows/autodromo.yml'
  push:
    paths:
      - 'autodromo/**'
      - 'tests/autodromo.mjs'
      - 'race-lab/source/src/data/**'
      - 'visual-lab/tripleLiveSchedule.js'
      - '.github/workflows/autodromo.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check car procedural modules
        run: |
          node --check autodromo/app.js
          node --check autodromo/car.js
          node --check autodromo/circuit.js
          node --check autodromo/logic.js
      - name: Official fixture and motorsport contract
        run: node --experimental-default-type=module --test tests/autodromo.mjs
