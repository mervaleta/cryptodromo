name: BTC V18 first real WebGL captures (fast)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/btc-v18-fast-screenshot-browser.mjs'
      - '.github/workflows/btc-v18-fast-screenshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-real-btc-v18-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.187.0
          npx playwright install chromium --with-deps
      - name: Capture real BTC V18 head, mane and hocks in Chromium
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/btc-v18-fast.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-v18-fast-screenshot-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-v18-fast-real-webgl-three-cameras
          path: artifacts/btc-v18-fast-screenshot/**
          if-no-files-found: warn
