name: MVP Showcase Contracts
on:
  pull_request:
    paths:
      - 'tests/mvp-showcase-acceptance.mjs'
      - 'race-lab/source/src/data/raceFixture.js'
      - 'race-lab/source/src/data/officialRace.js'
      - 'visual-lab/broadcastGates.js'
      - 'visual-lab/broadcastGateNumbers.js'
      - 'visual-lab/scene.js'
      - '.github/workflows/mvp-showcase.yml'
  workflow_dispatch:
jobs:
  showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MVP fixture, signage and official results
        run: node --test tests/mvp-showcase-acceptance.mjs
