name: Autodromo public deployment verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autodromo-public.yml'
      - 'autodromo/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual Hostinger route and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          base="https://race.cryptodromo.com"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt $attempt: checking $base/autodromo/"
            status=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/autodromo-live.html -w '%{http_code}' "$base/autodromo/?check=20261104" || true)
            echo "HTTP $status, bytes $(wc -c < /tmp/autodromo-live.html 2>/dev/null || echo 0)"
            if [ "$status" = 200 ] && grep -q 'El mercado' /tmp/autodromo-live.html && grep -q 'autodromo-overtake-1' /tmp/autodromo-live.html && grep -q 'id="pole-label"' /tmp/autodromo-live.html; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Hostinger is NOT serving the new autódromo HTML; GitHub merge does not imply deployment."
            exit 1
          fi
          for file in autodromo/app.js autodromo/traffic.js autodromo/logic.js autodromo/car.js autodromo/circuit.js autodromo/style.css race-lab/source/src/data/officialRace.js; do
            url="$base/$file?verify=traffic-director-v1-20261104"
            status=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/autodromo-asset -w '%{http_code}' "$url" || true)
            echo "$file: HTTP $status, bytes $(wc -c < /tmp/autodromo-asset)"
            test "$status" = 200 || { echo "::error::$file unavailable"; exit 1; }
          done
          curl -fsSL "$base/autodromo/logic.js?check=20261104" -o /tmp/autodromo-live-logic.js
          grep -q 'createOfficialRace' /tmp/autodromo-live-logic.js
          curl -fsSL "$base/autodromo/app.js?v=autodromo-overtake-1" -o /tmp/autodromo-live-app.js
          if ! grep -q 'traffic-director-v1' /tmp/autodromo-live-app.js; then
            echo "::error::The browser entrypoint is stale despite the updated HTML"
            echo "Production app bytes: $(wc -c </tmp/autodromo-live-app.js)"
            exit 1
          fi
          echo "AUTODROMO_PUBLIC_OVERTAKING_HTTP_OK"
