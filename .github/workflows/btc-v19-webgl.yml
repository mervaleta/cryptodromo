name: BTC V19 · native body Maya head 3-angle WebGL proof
on:
  pull_request:
    paths:
      - 'racers/experiments/maya-head-graft.js'
      - 'tests/btc-v19-fast-graft-browser.mjs'
      - '.github/workflows/btc-v19-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v19-native-body-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Three and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.187.0
          npx playwright install chromium --with-deps
      - name: Check authentic Maya head and unchanged native Gallop
        run: node --test tests/btc-maya-head-rig-contract.mjs
      - name: Capture real WebGL native-body candidate
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/btc-v19-native.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-v19-fast-graft-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-v19-native-body-maya-head-webgl
          path: artifacts/btc-v19-graft-fast/**
          if-no-files-found: warn
