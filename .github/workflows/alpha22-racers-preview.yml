name: Alpha22 Fidelity runner cards
on:
  pull_request:
    branches: [main]
    paths:
      - 'racers/**'
      - 'visual-lab/horse-fidelity/**'
      - 'tests/alpha22-racers-*.mjs'
      - '.github/workflows/alpha22-racers-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and no-model dependency contract
        run: |
          node --check racers/horse-preview.js
          node --check racers/racers.js
          node --test tests/alpha22-racers-contract.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Open runner profiles and check real animated horse
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 > /tmp/crp-racers.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node tests/alpha22-racers-browser.mjs
      - name: Keep portrait screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha22-runner-portraits
          path: artifacts/alpha22-racer-*
          if-no-files-found: ignore
