name: Cryptodromo public race preview
on:
  push:
    branches: [main]
    paths:
      - 'race-lab/source/**'
      - 'tests/official-race.mjs'
      - '.github/workflows/deploy-race-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cryptodromo-pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: race-lab/source/package-lock.json
      - name: Install dependencies
        working-directory: race-lab/source
        run: npm ci --no-audit --no-fund
      - name: Verify financial race engine
        working-directory: race-lab/source
        run: npm test
      - name: Precompute 3360 races and build site
        working-directory: race-lab/source
        run: npm run build
      - name: Enable GitHub Pages for this public preview
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: race-lab/source/dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
