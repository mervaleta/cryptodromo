name: Browser smoke test on live Cryptodromo
on:
  push:
    branches: [main]
    paths:
      - 'tests/hostinger-browser-smoke.mjs'
      - '.github/workflows/hostinger-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Test public race on Hostinger
        run: node tests/hostinger-browser-smoke.mjs
      - name: Save public screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cryptodromo-race
          path: artifacts/cryptodromo-race-live.png
          if-no-files-found: ignore
