name: Satoshi Nakamoto Stadium
on:
  pull_request:
    paths:
      - 'race-lab/source/**'
      - 'estadio/**'
      - 'index.html'
      - 'tests/stadium-world.mjs'
      - 'tests/stadium-surfaces.mjs'
      - 'tests/stadium-live-integration.mjs'
      - 'visual-lab/scene.js'
      - 'visual-lab/stadiumDistrict.js'
      - 'visual-lab/index.html'
      - 'docs/stadium/**'
      - '.github/workflows/stadium-check.yml'
  push:
    branches: [main]
    paths:
      - 'race-lab/source/**'
      - 'estadio/**'
      - 'index.html'
      - 'tests/stadium-world.mjs'
      - 'tests/stadium-surfaces.mjs'
      - 'tests/stadium-live-integration.mjs'
      - 'visual-lab/**'
      - 'alpha15/**'
      - 'docs/stadium/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'race-lab/source/package-lock.json'
      - name: JavaScript syntax
        run: |
          node --check race-lab/source/src/main.js
          node --check race-lab/source/src/churchillStadium.js
          node --check estadio/estadio.js
          node --check visual-lab/scene.js
          node --check visual-lab/stadiumDistrict.js
          node --check race-lab/source/src/stadium/presets.js
          node --check race-lab/source/src/stadium/venue.js
          node --check race-lab/source/src/stadium/surfaces.js
      - name: Build race application
        working-directory: race-lab/source
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Stadium and fixture contract
        run: node tests/stadium-integration.mjs
      - name: Three stadiums scenic integration and resource lifecycle
        run: node --test tests/stadium-world.mjs
      - name: Validate alpha14 scenic adapter without touching race rules
        run: node --test tests/stadium-live-integration.mjs
      - name: Validate procedural material generation
        run: node --test tests/stadium-surfaces.mjs
