name: Verified authentication security
on:
  pull_request:
    paths:
      - 'api/auth.php'
      - 'tests/auth-security.mjs'
      - '.github/workflows/auth-security.yml'
  push:
    branches: [main]
    paths:
      - 'api/auth.php'
      - 'tests/auth-security.mjs'
      - '.github/workflows/auth-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and test fail-closed authentication
        run: |
          php -v
          node --test tests/auth-security.mjs
