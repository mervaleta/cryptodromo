name: BTC Premium - native Gallop in real WebGL
on:
  pull_request:
    branches: [main]
    paths:
      - 'racers/btc-hero-v5.js'
      - 'racers/btc-silk-shell-v5.js'
      - 'racers/btc-atelier-preview.js'
      - 'racers/racers.js'
      - 'racers/index.html'
      - 'tests/btc-v5-premium-16-poses.mjs'
      - '.github/workflows/btc-v5-premium-16-poses.yml'
  push:
    branches: [main]
    paths:
      - 'racers/btc-hero-v5.js'
      - 'racers/btc-silk-shell-v5.js'
permissions:
  contents: read
jobs:
  visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax, safety contracts and revision manifest
        run: |
          node --check racers/btc-hero-v5.js
          node --check racers/btc-silk-shell-v5.js
          node --check racers/btc-atelier-preview.js
          node --check racers/racers.js
          node --check tests/btc-v5-premium-16-poses.mjs
          node --test tests/btc-master-change-policy.mjs
      - name: Install Chromium with WebGL software backend
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Capture native Gallop phases in actual BTC page
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 > /tmp/crp-btc-premium-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-v5-premium-16-poses.mjs
      - name: Save browser screenshots for human anatomical review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-premium-16-phases-five-cameras
          path: artifacts/btc-v5-premium-16/**
          if-no-files-found: warn
