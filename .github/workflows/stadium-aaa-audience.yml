name: Satoshi AAA audience - real browser and crowd geometry
on:
  # GitHub API-authored commits can fail to retrigger PR-only checks; also
  # validate this isolated branch directly, without running other workflows.
  push:
    branches:
      - feat/satoshi-aaa-audience-20261105
    paths:
      - 'visual-lab/scene.js'
      - 'visual-lab/stadiumDensity.js'
      - 'visual-lab/stadiumGrandstandCrowd.js'
      - 'visual-lab/stadiumStaticBatches.js'
      - 'visual-lab/stadiumBackdrop.js'
      - 'visual-lab/satoshiPavilionDetail.js'
      - 'visual-lab/pavilionPlacement.js'
      - 'tests/satoshi-pavilion-detail.mjs'
      - 'visual-lab/index.html'
      - 'stadiums/crypto/broadcast/index.html'
      - 'visual-lab/stadiumRailClearance.js'
      - 'tests/stadium-rail-clearance.mjs'
      - 'tests/stadium-aaa-audience-browser.mjs'
      - 'tests/stadium-aaa-audience-comparison.mjs'
      - 'tests/stadium-presentation-visibility-browser.mjs'
      - 'tests/stadium-aaa-audience.mjs'
      - 'tests/stadium-grandstand-crowd.mjs'
      - 'tests/stadium-static-batches.mjs'
      - 'tests/stadium-occlusion-qa.mjs'
      - 'tests/stadium-clean-photo-finish-tv.mjs'
      - '.github/workflows/stadium-aaa-audience.yml'
  pull_request:
    paths:
      - 'visual-lab/stadiumDensity.js'
      - 'visual-lab/stadiumGrandstandCrowd.js'
      - 'visual-lab/stadiumStaticBatches.js'
      - 'visual-lab/stadiumBackdrop.js'
      - 'visual-lab/scene.js'
      - 'visual-lab/stadiumRailClearance.js'
      - 'visual-lab/satoshiPavilionDetail.js'
      - 'visual-lab/pavilionPlacement.js'
      - 'tests/satoshi-pavilion-detail.mjs'
      - 'visual-lab/index.html'
      - 'stadiums/crypto/broadcast/index.html'
      - 'tests/stadium-aaa-audience*'
      - 'tests/stadium-static-batches.mjs'
      - 'tests/stadium-occlusion-qa.mjs'
      - 'tests/stadium-clean-photo-finish-tv.mjs'
      - 'tests/stadium-rail-clearance.mjs'
      - 'tests/stadium-presentation-visibility-browser.mjs'
      - '.github/workflows/stadium-aaa-audience.yml'
  workflow_dispatch:
concurrency:
  group: satoshi-aaa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ES modules
        run: |
          node --experimental-default-type=module --check visual-lab/stadiumDensity.js
          node --experimental-default-type=module --check visual-lab/stadiumGrandstandCrowd.js
          node --experimental-default-type=module --check visual-lab/stadiumStaticBatches.js
          node --experimental-default-type=module --check visual-lab/stadiumBackdrop.js
          node --experimental-default-type=module --check visual-lab/scene.js
          node --experimental-default-type=module --check visual-lab/stadiumRailClearance.js
          node --experimental-default-type=module --check visual-lab/satoshiPavilionDetail.js
          node --experimental-default-type=module --check visual-lab/pavilionPlacement.js
          node --experimental-default-type=module --check tests/satoshi-pavilion-detail.mjs
          node --experimental-default-type=module --check tests/stadium-aaa-audience.mjs
          node --experimental-default-type=module --check tests/stadium-grandstand-crowd.mjs
          node --experimental-default-type=module --check tests/stadium-static-batches.mjs
          node --experimental-default-type=module --check tests/stadium-occlusion-qa.mjs
          node --experimental-default-type=module --check tests/stadium-rail-clearance.mjs
          node --experimental-default-type=module --check tests/stadium-presentation-visibility-browser.mjs
          node --experimental-default-type=module --check tests/stadium-aaa-audience-browser.mjs
          node --experimental-default-type=module --check tests/stadium-aaa-audience-comparison.mjs
          node --experimental-default-type=module --check tests/stadium-clean-photo-finish-tv.mjs
      - name: Validate audience geometry and existing safety contracts
        run: node --experimental-default-type=module --test tests/stadium-aaa-audience.mjs tests/stadium-grandstand-crowd.mjs tests/stadium-static-batches.mjs tests/stadium-occlusion-qa.mjs tests/stadium-rail-clearance.mjs tests/satoshi-pavilion-detail.mjs tests/stadium-clean-photo-finish-tv.mjs
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Checkout pinned baseline for comparison
        uses: actions/checkout@v4
        with:
          ref: b5b0bd673a4a4827f74f360f55976e9d9b66917a
          path: baseline-stadium
      - name: Render actual 3D scene and capture evidence
        env:
          CRP_BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/stadium-audience-server.log 2>&1 &
          server_pid=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory baseline-stadium >/tmp/stadium-baseline-server.log 2>&1 &
          baseline_pid=$!
          trap 'kill $server_pid $baseline_pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/stadium-aaa-audience-browser.mjs
          node tests/stadium-presentation-visibility-browser.mjs
          node tests/stadium-aaa-audience-comparison.mjs
      - name: Preserve real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-aaa-audience-render
          path: artifacts/stadium-aaa-audience/
          if-no-files-found: ignore
