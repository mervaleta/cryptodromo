name: Race Lab CC0 loader diagnostic (single run)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/crp-race-lab-cc0-diag.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Inspect live Race Lab resource and horse model errors
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader']});
          const ctx=await b.newContext({viewport:{width:1000,height:750}});
          const p=await ctx.newPage();const logs=[],failures=[];
          await p.route('**/race-lab/source/src/horse.js*',async route=>{
           const response=await route.fetch();
           let code=await response.text();
           const patches=[
             ["if(!assetPromise){","console.log('CRP_HORSE_DBG_PROMISE_ENTER');if(!assetPromise){"],
             ["const response=await fetch(MODEL_URL);","console.log('CRP_HORSE_DBG_FETCH_BEGIN');const response=await fetch(MODEL_URL);console.log('CRP_HORSE_DBG_FETCH_END',response.status);"],
             ["const compressed=await response.arrayBuffer();","const compressed=await response.arrayBuffer();console.log('CRP_HORSE_DBG_BYTES',compressed.byteLength);"],
             ["const binary=await new Response(stream).arrayBuffer();","const binary=await new Response(stream).arrayBuffer();console.log('CRP_HORSE_DBG_UNZIP',binary.byteLength);"],
             ["const gltf=await new GLTFLoader().parseAsync(","console.log('CRP_HORSE_DBG_PARSE_BEGIN');const gltf=await new GLTFLoader().parseAsync("],
             ["smoothHorseNormals(gltf.scene,{strength:.91});","console.log('CRP_HORSE_DBG_PARSE_END');smoothHorseNormals(gltf.scene,{strength:.91});"],
             ["const asset=await loadHorseAsset(),model=clone(asset.scene);","console.log('CRP_HORSE_DBG_CREATE_ENTER');const asset=await loadHorseAsset(),model=clone(asset.scene);console.log('CRP_HORSE_DBG_CLONE_DONE');"],
             ["api.play(mode,0);mixer.update(phase);return api;","api.play(mode,0);mixer.update(phase);console.log('CRP_HORSE_DBG_READY');return api;"]
           ];
           for(const [oldv,newv] of patches){
            if(!code.includes(oldv))console.log('PATCH_MISS',oldv);
            code=code.replace(oldv,newv);
           }
           await route.fulfill({response,body:code,contentType:'text/javascript'});
          });
          await p.route('**/race-lab/source/src/tokenHorseFactory.js*',async route=>{
           const res=await route.fetch();let code=await res.text();
           code=code.replace("const horse=await createHorse({","console.log('CRP_FACTORY_CREATE_START',id.symbol);const horse=await createHorse({");
           code=code.replace("horse.setTokenProfile=(next,activeProfiles=profiles)=>","console.log('CRP_FACTORY_CREATE_DONE',id.symbol);horse.setTokenProfile=(next,activeProfiles=profiles)=>");
           code=code.replace("return horse;","console.log('CRP_FACTORY_RETURN',id.symbol);return horse;");
           await route.fulfill({response:res,body:code,contentType:'text/javascript'});
          });
          await p.route('**/race-lab/source/src/main.js*',async route=>{
           const res=await route.fetch();let code=await res.text();
           code=code.replace("const models=await Promise.all(horses.map(","console.log('CRP_LAB_LOADING_12');const models=await Promise.all(horses.map(");
           code=code.replace("models.forEach((model,index)=>{","console.log('CRP_LAB_READY_12',models.length);models.forEach((model,index)=>{console.log('CRP_LAB_BEFORE_DISPOSE',index);");
           code=code.replace("disposePlaceholder(h);h.model=model;","disposePlaceholder(h);console.log('CRP_LAB_AFTER_DISPOSE',index);h.model=model;console.log('CRP_LAB_MODEL_ASSIGNED',index);");
           code=code.replace("    diagnostics.textContent='CC0 CON CRIN Y COLA","    console.log('CRP_LAB_ALL_ASSIGNED');diagnostics.textContent='CC0 CON CRIN Y COLA");
           await route.fulfill({response:res,body:code,contentType:'text/javascript'});
          });
          p.on('pageerror',e=>logs.push('PAGEERROR '+e.message));
          p.on('console',m=>{if(['error','warn'].includes(m.type())||/^CRP_(HORSE|FACTORY|LAB)/.test(m.text()))logs.push(m.type()+': '+m.text());});
          p.on('requestfailed',req=>failures.push('FAIL '+req.url()+' '+req.failure()?.errorText));
          p.on('response',r=>{if(r.status()>=400)failures.push('HTTP '+r.status()+' '+r.url())});
          try{
           const res=await p.goto('https://race.cryptodromo.com/race-lab/source/?horse-qa=100&diag=loader-20261115',{waitUntil:'domcontentloaded',timeout:45000});
           console.log('NAV_HTTP',res.status());
           await p.waitForTimeout(6000);
           const s=await p.evaluate(()=>({
            qa:window.__crpUnifiedHorsesQA?.(),
            diag:[...document.querySelectorAll('#sceneWrap>div')].map(x=>x.textContent?.slice(0,120)),
            status:document.querySelector('#raceStatus')?.textContent,
            models:performance.getEntriesByType('resource').filter(x=>/horse\.glb|horse\.js|tokenHorseFactory|horseGroom/.test(x.name)).map(x=>({name:x.name,duration:x.duration,bytes:x.transferSize}))
           }));
           console.log('QA_JSON',JSON.stringify(s));
           console.log('WARN_AND_ERRORS',JSON.stringify(logs.slice(-115)));
           console.log('NETWORK_FAILURES',JSON.stringify(failures.slice(-35)));
          }catch(e){console.log('DIAG_ERROR',e.message);}
          finally{await ctx.close();await b.close();}
          JS
