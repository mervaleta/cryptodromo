name: Canonical Cinematic HOME
on:
  pull_request:
    branches: [main, integration/alpha22-fidelity-on-alpha20-20261103]
    paths:
      - 'index.html'
      - 'visual-lab/index.html'
      - 'visual-lab/scene.js'
      - 'visual-lab/horseRenderer.js'
      - 'visual-lab/cinematicLineup.js'
      - 'assets/crp-global-nav.js'
      - 'tests/home-cinematic-*.mjs'
      - 'tests/procedural-live*.mjs'
      - '.github/workflows/home-cinematic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse canonical scene and new QA
        run: |
          for file in visual-lab/scene.js visual-lab/horseRenderer.js visual-lab/cinematicLineup.js assets/crp-global-nav.js tests/home-cinematic-*.mjs tests/procedural-live*.mjs tests/alpha22-live-browser.mjs; do
            node --check "$file"
          done
      - name: Contract, official race and gate parity
        run: |
          node --test tests/home-cinematic-contract.mjs tests/procedural-live.mjs tests/official-race.mjs tests/alpha20-scene-integration.mjs tests/alpha20-gates.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Canonical home WebGL and old Visual Lab redirect
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/home-cine.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node tests/home-cinematic-browser.mjs
      - name: Preserve home QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-home-alpha22
          path: artifacts/home-*
          retention-days: 30
          if-no-files-found: ignore
