name: Alpha22 Procedural Horse Fidelity
on:
  pull_request:
    branches: [main]
    paths:
      - 'visual-lab/horse-fidelity/**'
      - 'visual-lab/horse-fidelity-preview/**'
      - 'tests/alpha22-*'
      - '.github/workflows/alpha22-procedural-horse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse each procedural module as JavaScript
        run: |
          for file in visual-lab/horse-fidelity/*.js visual-lab/horse-fidelity-preview/*.js tests/alpha22-*.mjs; do
            node --check "$file"
          done
      - name: Unit contracts for identity, geometry and map-free shader
        run: node --test tests/alpha22-horse-contract.mjs tests/procedural-live.mjs tests/alpha20-scene-integration.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Validate generated horses without external 3D model
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 > /tmp/alpha22-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node tests/alpha22-horse-browser.mjs
          node tests/alpha22-live-browser.mjs
      - name: Keep visual proof and GPU measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha22-original-procedural-horse-screens
          path: artifacts/
          retention-days: 30
          if-no-files-found: ignore
