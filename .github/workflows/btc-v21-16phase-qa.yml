name: BTC V21 16-phase real WebGL visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'racers/btc-maya-master.js'
      - 'racers/btc-maya-groom.js'
      - 'racers/btc-atelier-preview.js'
      - 'racers/racers.js'
      - 'racers/index.html'
      - 'tests/btc-v21-16phase-qa.mjs'
      - '.github/workflows/btc-v21-16phase-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-v21:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static code and build agreement
        run: |
          node --check racers/btc-maya-master.js
          node --check racers/btc-maya-groom.js
          node --check racers/btc-atelier-preview.js
          node --check tests/btc-v21-16phase-qa.mjs
          node --test tests/btc-horse-atelier-contract.mjs tests/btc-v12-anatomy-contract.mjs tests/btc-master-change-policy.mjs
      - name: Install Chromium and Three
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.187.0
          npx playwright install chromium --with-deps
      - name: Render 16 real Gallop frames and all cameras
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/btc-v21-qa.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-v21-16phase-qa.mjs
      - name: Save real Chromium WebGL pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v21-16-gallop-six-cameras
          path: artifacts/btc-v21-full-cycle/**
          if-no-files-found: warn
