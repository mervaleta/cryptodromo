name: BTC neck closure - original versus repaired V5 in WebGL
on:
  pull_request:
    branches: [main]
    paths:
      - 'racers/btc-neck-crest-repair.js'
      - 'racers/btc-hero-v5.js'
      - 'racers/btc-atelier-preview.js'
      - 'racers/racers.js'
      - 'racers/index.html'
      - 'tests/btc-neck-closure-visual.mjs'
      - 'tests/btc-native-neck-geometry.mjs'
      - '.github/workflows/btc-neck-closure-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and native-gallop invariants
        run: |
          node --check racers/btc-neck-crest-repair.js
          node --check racers/btc-hero-v5.js
          node --check racers/btc-atelier-preview.js
          node --check racers/racers.js
          node --check tests/btc-neck-closure-visual.mjs
          node --check tests/btc-native-neck-geometry.mjs
          node --test tests/btc-master-change-policy.mjs
      - name: Install Chromium / SwiftShader
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.187.0
          npx playwright install chromium --with-deps
      - name: Check closure against REAL GLB and 16 authored Gallop poses
        run: node --test tests/btc-native-neck-geometry.mjs
      - name: Render old V5 and repaired V5 through the same browser
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 > /tmp/btc-neck-visual-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-neck-closure-visual.mjs
      - name: Retain all actual 16-phase browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-native-neck-closure-before-after-real-webgl
          path: artifacts/btc-neck-closure/**
          if-no-files-found: warn
