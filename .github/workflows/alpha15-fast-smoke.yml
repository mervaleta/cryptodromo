name: Alpha16 public fast smoke
on:
  push:
    branches: [main]
    paths:
      - 'tests/alpha15-fast-smoke.mjs'
      - 'parade/**'
      - 'index.html'
      - 'visual-lab/**'
      - 'resultados/**'
      - 'estadisticas/**'
      - 'cronicas/**'
      - 'fixture/**'
      - 'apuestas/**'
      - '.github/workflows/alpha15-fast-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Smoke test public Alpha15 pages and 3D scene
        run: node tests/alpha15-fast-smoke.mjs
