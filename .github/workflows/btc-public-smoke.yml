name: BTC V20b · verify Hostinger, Gallop and six real WebGL cameras
on:
  push:
    branches: [main]
    paths: ['racers/**','tests/btc-public-master-browser.mjs','.github/workflows/btc-public-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hostinger-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify effective Hostinger build rather than just GitHub
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://race.cryptodromo.com/racers'
          for attempt in $(seq 1 24); do
            ok=true
            for module in index.html racers.js btc-atelier-preview.js btc-maya-master.js btc-maya-groom.js btc-maya-face-details.js btc-maya-pose-volume.js btc-native-hind-limb-repair.js btc-master-revision.json; do
              if ! curl -fLsS --connect-timeout 10 --max-time 30 "$ORIGIN/$module?deploy=$GITHUB_SHA-$attempt" -o "/tmp/btc-$module"; then ok=false;break;fi
            done
            if [[ "$ok" == true ]] &&
               grep -Fq 'btc-v20b-native-hind-gallop-20261105' /tmp/btc-index.html &&
               grep -Fq 'btc-v20b-native-hind-gallop-20261105' /tmp/btc-racers.js &&
               grep -Fq 'btc-v20b-native-hind-gallop-20261105' /tmp/btc-btc-atelier-preview.js &&
               grep -Fq 'btc-v20b-native-hind-gallop-20261105' /tmp/btc-btc-maya-master.js &&
               grep -Fq 'btc-v20b-native-hind-gallop-20261105' /tmp/btc-btc-master-revision.json &&
               grep -Fq 'original GLB' /tmp/btc-btc-native-hind-limb-repair.js; then
              echo 'HOSTINGER_BTC_V20B_NATIVE_HIND_EFFECTIVE_BUILD_CONFIRMED'
              break
            fi
            if [[ "$attempt" == 24 ]]; then echo '::error::Hostinger has not delivered BTC V20b'; exit 1;fi
            sleep 15
          done
      - name: Install Chromium for real browser rendering
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Capture canonical live BTC and 16-phase real Gallop
        run: node tests/btc-public-master-browser.mjs
      - name: Retain visual evidence for owner comparison, NOT AAA approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v20b-hostinger-16phase-sixcam-real-webgl
          path: artifacts/btc-live/*.png
          if-no-files-found: warn
