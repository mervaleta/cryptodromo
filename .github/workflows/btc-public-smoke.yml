name: Verify BTC Premium V5 actually published on Hostinger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-public-smoke.yml'
      - 'racers/**'
      - 'tests/btc-public-master-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check exact versioned production module chain
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://race.cryptodromo.com/racers"
          for attempt in $(seq 1 24); do
            echo "Checking BTC public CDN/Hostinger deployment: $attempt/24"
            ok=true
            for module in index.html racers.js btc-atelier-preview.js btc-hero-v5.js btc-silk-shell-v5.js btc-master-revision.json; do
              if ! curl -fLsS --retry 2 --connect-timeout 10 --max-time 30 "$ORIGIN/$module?deploy=$GITHUB_SHA-$attempt" -o "/tmp/crp-btc-$module"; then
                ok=false; break
              fi
            done
            if [[ "$ok" == true ]] &&
              grep -q 'btc-v5-luxury-profile-20261105-v2' /tmp/crp-btc-index.html &&
              grep -q 'btc-v5-luxury-profile-20261105-v2' /tmp/crp-btc-racers.js &&
              grep -q 'btc-v5-luxury-profile-20261105-v2' /tmp/crp-btc-btc-atelier-preview.js &&
              grep -q 'refineSkinnedCoat' /tmp/crp-btc-btc-hero-v5.js &&
              grep -q '.01735' /tmp/crp-btc-btc-silk-shell-v5.js &&
              grep -q 'btc-v5-luxury-profile-20261105-v2' /tmp/crp-btc-btc-master-revision.json; then
              echo 'HOSTINGER_BTC_PREMIUM_MODULE_CHAIN_DEPLOYED'
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo '::error::GitHub merged but Hostinger still serves stale/missing BTC Premium modules'
              exit 1
            fi
            sleep 15
          done
      - name: Install Chromium for actual production WebGL inspection
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Verify canonical BTC 3D and 16 phases on actual live site
        run: node tests/btc-public-master-browser.mjs
      - name: Keep browser screenshots for explicit visual owner approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-premium-live-real-browser-five-cameras
          path: artifacts/btc-live/*.png
          if-no-files-found: warn
