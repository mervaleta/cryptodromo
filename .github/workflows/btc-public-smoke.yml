name: Verify public BTC Hero V4 on race.cryptodromo.com
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-public-smoke.yml'
      - 'racers/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify public site serves V4, not only GitHub source
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://race.cryptodromo.com/racers"
          for attempt in $(seq 1 14); do
            echo "Attempt ${attempt}: checking Hostinger public pages"
            if curl -fLsS --connect-timeout 8 --max-time 20 "${ORIGIN}/racers.js?audit=${GITHUB_SHA}" -o /tmp/racers.js &&
               curl -fLsS --connect-timeout 8 --max-time 20 "${ORIGIN}/btc-atelier-preview.js?audit=${GITHUB_SHA}" -o /tmp/preview.js &&
               curl -fLsS --connect-timeout 8 --max-time 20 "${ORIGIN}/btc-hero-v4.js?audit=${GITHUB_SHA}" -o /tmp/hero.js &&
               grep -q "btc-real-hero-v4-20261103" /tmp/racers.js &&
               grep -q "createBTCHeroV4" /tmp/preview.js &&
               grep -q "new THREE.SkinnedMesh" /tmp/hero.js; then
              echo "PASS: live public domain serves functional BTC Hero V4 code."
              exit 0
            fi
            echo "Not deployed to public origin yet."
            sleep 15
          done
          echo "::error::GitHub main contains BTC V4, but public Hostinger origin does not serve it."
          exit 1
