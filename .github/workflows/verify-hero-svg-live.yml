name: Verify BTC Hero SVG preview deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-hero-svg-live.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify standalone visual lab is served by the live race domain
        shell: bash
        run: |
          set -uo pipefail
          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            file=$(mktemp)
            status=$(curl -L -sS --max-time 17 -o "$file" -w '%{http_code}' "https://race.cryptodromo.com/laboratorio/btc-hero-horse.html?preview=7059c6d-$attempt" || true)
            echo "Attempt $attempt HTTP $status"
            if [ "$status" = 200 ] && grep -q 'BTC . Hero Horse' "$file" && grep -q 'generateGroom()' "$file" && grep -q 'PROTOTIPO SVG' "$file"; then
              echo "::notice::BTC Hero SVG experimental preview is deployed"
              ready=1
              rm -f "$file"
              break
            fi
            rm -f "$file"
            sleep 12
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Hostinger has not deployed the isolated BTC SVG preview."
            exit 1
          fi