name: BTC V20 real Gallop hind legs 3-angle WebGL
on:
  pull_request:
    branches: [main]
    paths:
      - 'racers/btc-native-hind-limb-repair.js'
      - 'racers/btc-maya-master.js'
      - 'racers/btc-atelier-preview.js'
      - 'racers/racers.js'
      - 'racers/index.html'
      - 'tests/btc-v20-native-hind-webgl-browser.mjs'
      - '.github/workflows/btc-v20-native-hind-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native-hind-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate syntax
        run: |
          node --check racers/btc-native-hind-limb-repair.js
          node --check racers/btc-maya-master.js
          node --check tests/btc-v20-native-hind-webgl-browser.mjs
      - name: Chromium and Three.js
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.187.0
          npx playwright install chromium --with-deps
      - name: Render original GLB Gallop with transplanted hind legs
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/btc-v20.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-v20-native-hind-webgl-browser.mjs
      - name: Preserve actual Chromium screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v20-authored-native-hind-webgl
          path: artifacts/btc-v20-hind-real-webgl/**
          if-no-files-found: warn
