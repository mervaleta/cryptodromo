name: Autodromo Crypto browser smoke
on:
  pull_request:
    paths:
      - 'autodromo/**'
      - 'tests/autodromo-browser.mjs'
      - '.github/workflows/autodromo-browser.yml'
  push:
    paths:
      - 'autodromo/**'
      - 'tests/autodromo-browser.mjs'
      - '.github/workflows/autodromo-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Start site
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/autodromo-server.log 2>&1 &
          sleep 2
      - name: Visual 3D and race smoke
        run: node tests/autodromo-browser.mjs
      - name: Publish screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodromo-vector-chromium
          path: /tmp/autodromo-vector-desktop.png
          if-no-files-found: ignore
