name: Sports seasons, fan clubs and LIVE ceremony
on:
  push:
    paths:
      - 'sports/**'
      - 'scripts/archive-season.mjs'
      - 'temporadas/**'
      - 'clubes/**'
      - 'tests/sports-season-clubs-ceremony.mjs'
      - 'tests/sports-phase3-browser.mjs'
      - 'visual-lab/scene.js'
      - '.github/workflows/sports-season-clubs.yml'
  pull_request:
    paths:
      - 'sports/**'
      - 'scripts/archive-season.mjs'
      - 'temporadas/**'
      - 'clubes/**'
      - 'tests/sports-season-clubs-ceremony.mjs'
      - 'tests/sports-phase3-browser.mjs'
      - 'visual-lab/scene.js'
      - '.github/workflows/sports-season-clubs.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modules and CLI syntax
        run: |
          node --check sports/seasonArchive.js
          node --check sports/archiveWriter.mjs
          node --check sports/fanClubs.js
          node --check sports/grandPrixCeremony.js
          node --check scripts/archive-season.mjs
          node --check clubes/clubes.js
          node --check temporadas/temporadas.js
          node --check visual-lab/scene.js
      - name: Official engine, Grand Prix and community regressions
        run: |
          node --experimental-default-type=module --test \
            tests/sports-season-clubs-ceremony.mjs \
            tests/grand-prix.mjs \
            tests/grand-prix-3d.mjs \
            tests/official-race.mjs \
            tests/track-splits.mjs
  browser:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Serve repo files
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 > /tmp/crp-phase3-http.log 2>&1 &
          sleep 2
      - name: Validate clubs and public season archive UI
        run: node tests/sports-phase3-browser.mjs
