name: Public wording contract
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**/*.js'
      - 'autodromo/**/*.js'
      - 'race-lab/source/src/**/*.js'
      - 'tests/public-no-demo-copy.mjs'
      - '.github/workflows/no-demo-public.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**/*.js'
      - 'autodromo/**/*.js'
      - 'race-lab/source/src/**/*.js'
      - 'tests/public-no-demo-copy.mjs'
      - '.github/workflows/no-demo-public.yml'
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public labels and synthetic disclosure regression
        run: |
          node --experimental-default-type=module --test tests/public-no-demo-copy.mjs
          for file in assets/crypto-venue.js assets/crypto-venue-broadcast-aaa-20261105.js assets/stadium-network-ui.js assets/stadium-network-engine.js autodromo/app.js; do node --check "$file"; done

  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm public Hostinger URLs no longer show the removed label
        env:
          SITE: https://race.cryptodromo.com
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const paths=['/','/stadiums/crypto/live/','/stadiums/crypto/broadcast/',
            '/visual-lab/','/autodromo/','/stadiums/','/institucional/',
            '/racers/','/stables/','/apuestas/','/fixture/'];
          // Fetch precisely the versioned assets referenced by the public HTML,
          // not a fresh ad-hoc query that can pass while the browser stays stale.
          const expectedScripts={
            '/stadiums/crypto/live/':'/assets/crypto-venue-broadcast-aaa-20261105.js',
            '/stadiums/crypto/broadcast/':'/assets/crp-global-nav.js?v=copy-clean-20261105-v1',
            '/visual-lab/':'/assets/crp-global-nav.js?v=copy-clean-20261105-v1',
            '/autodromo/':'./app.js?v=copy-clean-20261105-v1',
            '/stadiums/':'/assets/stadium-network-ui.js?v=copy-clean-20261105-v1',
            '/institucional/':'/assets/crp-global-nav.js?v=copy-clean-20261105-v1',
            '/racers/':'/assets/crp-global-nav.js?v=copy-clean-20261105-v1',
            '/stables/':'/assets/stables.js?v=copy-clean-20261105-v1'
          };
          const sourcePaths=[...new Set(Object.entries(expectedScripts).map(([route,src])=>
            new URL(src,process.env.SITE+route).pathname+new URL(src,process.env.SITE+route).search)
          )];
          async function check(){
            const failures=[];
            for(const path of paths){
              try{
                const response=await fetch(process.env.SITE+path+'?crp-copy=20261105',{cache:'no-store'});
                if(!response.ok){failures.push(path+': HTTP '+response.status);continue;}
                const raw=await response.text();
                const withoutScripts=raw.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'')
                  .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'')
                  .replace(/<!--[^]*?-->/g,'');
                const display=withoutScripts.replace(/<[^>]*>/g,' ');
                const meta=[...withoutScripts.matchAll(/\b(?:content|title|alt|aria-label)=(["'])(.*?)\1/gi)]
                  .map(m=>m[2]).filter(v=>!/^https?:/.test(v)).join(' ');
                if(/\bdemo\b/i.test(display+' '+meta))failures.push(path+': stale public badge');
                const expected=expectedScripts[path];
                if(expected&&!raw.includes(expected))failures.push(path+': HTML still loads stale script instead of '+expected);
              }catch(error){failures.push(path+': '+error.message);}
            }
            for(const path of sourcePaths){
              try{
                const response=await fetch(process.env.SITE+path,{cache:'no-store'});
                if(!response.ok){failures.push(path+': HTTP '+response.status);continue;}
                const body=await response.text();
                if(/(?:●|·)\s*DEMO\b|<[^>]+>DEMO<\//.test(body))
                  failures.push(path+': stale dynamic JS badge');
                if(path.includes('/assets/stadium-network-ui.js')&&
                   !body.includes('/assets/stadium-network-engine.js?v=copy-clean-20261105-v1'))
                   failures.push(path+': uses old fixture engine import');
              }catch(error){failures.push(path+': '+error.message);}
            }
            return failures;
          }
          let failures=[];
          for(let i=0;i<8;i++){
            failures=await check();
            if(!failures.length){console.log('PUBLIC_COPY_OK: no visible DEMO on '+paths.length+' major pages and '+sourcePaths.length+' JS modules');process.exit(0);}
            console.log('Attempt '+(i+1)+': '+JSON.stringify(failures));
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          assert.deepEqual(failures,[]);
          JS
