name: Marketing inventory checks
on:
  pull_request:
    paths:
      - 'marketing/**'
      - 'assets/ad-inventory.*'
      - 'assets/marketing.css'
      - 'assets/crp-global-nav.js'
      - 'assets/institutional.js'
      - 'tests/marketing-inventory.mjs'
  push:
    branches: ['feature/marketing-inventory-20261103']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inventory contracts
        run: node --test tests/marketing-inventory.mjs
