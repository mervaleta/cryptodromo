name: Satoshi stadium · three staggered countdowns
on:
  pull_request:
    paths:
      - 'stadiums/crypto/index.html'
      - 'assets/crypto-stadium-clocks.js'
      - 'assets/crypto-channel-countdown.js'
      - 'visual-lab/tripleLiveSchedule.js'
      - 'tests/satoshi-venue-clock-contract.mjs'
      - 'tests/satoshi-venue-clock-browser.mjs'
      - '.github/workflows/satoshi-venue-clock-correction.yml'
  push:
    branches: [main]
    paths:
      - 'stadiums/crypto/index.html'
      - 'assets/crypto-stadium-clocks.js'
      - 'assets/crypto-channel-countdown.js'
      - 'visual-lab/tripleLiveSchedule.js'
      - 'tests/satoshi-venue-clock-contract.mjs'
      - 'tests/satoshi-venue-clock-browser.mjs'
      - '.github/workflows/satoshi-venue-clock-correction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify next-start clock math and route ownership
        run: |
          node --experimental-default-type=module --check assets/crypto-stadium-clocks.js
          node --experimental-default-type=module --test tests/satoshi-venue-clock-contract.mjs tests/stadium-staggered-countdowns.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Check actual DOM on local branch
        env:
          CRP_CLOCKS_BASE: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/satoshi-clock-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/satoshi-venue-clock-browser.mjs
      - name: Verify publication on public Satoshi stadium after merge
        if: github.event_name == 'push'
        env:
          CRP_CLOCKS_BASE: https://race.cryptodromo.com
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Hostinger Satoshi venue check attempt $attempt"
            if node tests/satoshi-venue-clock-browser.mjs; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Keep browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-one-minute-stagger-proof
          path: artifacts/satoshi-venue-clocks/
          if-no-files-found: ignore
