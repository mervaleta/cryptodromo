name: BTC V20b live public Chromium WebGL two-phase spot check
on:
  push:
    branches: [main]
    paths:
      - 'tests/btc-v20b-live-spot-check.mjs'
      - '.github/workflows/btc-v20b-live-spot-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-public-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium, no local render server
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Verify two actual public Hostinger Gallop poses
        run: node tests/btc-v20b-live-spot-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-v20b-public-hostinger-real-webgl
          path: artifacts/btc-v20b-live-spot/**
          if-no-files-found: warn
