name: BTC V20b · 16 exact Gallop poses Chromium/WebGL
on:
  pull_request:
    paths:
      - 'tests/btc-v20b-16phase-qa.mjs'
      - '.github/workflows/btc-v20b-16phase-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-hock-every-pose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright and Three
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.187.0
          npx playwright install chromium --with-deps
      - name: Capture 16 real GLB Gallop phases and three views
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/btc-v20b-16phase.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-v20b-16phase-qa.mjs
      - name: Upload real WebGL stills for manual anatomy inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v20b-all-16-gallop-poses-and-three-views
          path: artifacts/btc-v20b-full-cycle/**
          if-no-files-found: warn
