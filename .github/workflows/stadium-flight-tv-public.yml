name: Satoshi interactive flight and TV · public acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tests/stadium-flight-tv-public.mjs'
      - '.github/workflows/stadium-flight-tv-public.yml'
      - 'estadio/flightControls.js'
      - 'estadio/estadio.js'
      - 'stadiums/crypto/live/index.html'
      - 'assets/crypto-venue.js'
      - 'assets/satoshi-tv.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Run click-to-fly and channel/camera browser test against deployed Hostinger
        env:
          CRP_BASE_URL: https://race.cryptodromo.com
        run: node tests/stadium-flight-tv-public.mjs
      - name: Keep public screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-public-flight-tv
          path: artifacts/stadium-flight-public/
          if-no-files-found: ignore
