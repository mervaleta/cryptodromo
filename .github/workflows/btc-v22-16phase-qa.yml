name: BTC V23 · native Maya hind-sculpt Chromium WebGL
on:
  # API-authored commits may not trigger pull_request checks. Run only this
  # isolated candidate on push so the 16-phase WebGL QA stays executable.
  push:
    branches:
      - feat/btc-v22-continuous-hind-seam-20261107
    paths:
      - 'racers/btc-native-hind-limb-repair.js'
      - 'racers/btc-maya-master.js'
      - 'racers/btc-maya-groom.js'
      - 'racers/btc-atelier-preview.js'
      - 'tests/btc-v22-16phase-qa.mjs'
      - 'tests/btc-native-hind-ab.mjs'
      - 'tests/btc-horse-atelier-contract.mjs'
      - 'tests/btc-v12-anatomy-contract.mjs'
      - 'tests/btc-master-change-policy.mjs'
      - 'tests/btc-maya-native-index-identity.mjs'
      - 'racers/racers.js'
      - 'racers/index.html'
      - '.github/workflows/btc-v22-16phase-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'racers/btc-native-hind-limb-repair.js'
      - 'racers/btc-maya-master.js'
      - 'racers/btc-maya-groom.js'
      - 'racers/btc-atelier-preview.js'
      - 'racers/racers.js'
      - 'racers/index.html'
      - 'tests/btc-v22-16phase-qa.mjs'
      - 'tests/btc-maya-native-index-identity.mjs'
      - 'scripts/extract-btc-maya-skin.py'
      - 'tools/btc/**'
      - '.github/workflows/btc-v22-16phase-qa.yml'
  workflow_dispatch:
concurrency:
  group: btc-v23-webgl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  native-hind-sculpt-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Publish isolated WebGL run locator (commit status only)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CONTEXT: "BTC V23 16-phase WebGL run locator"
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context="$RUN_CONTEXT" \
            -f description="run_id=$GITHUB_RUN_ID" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate actual source, build and rollback
        run: |
          python3 -m py_compile scripts/extract-btc-maya-skin.py tools/btc/export_maya_skincluster.py tools/btc/validate_maya_skincluster.py tools/btc/test_validate_maya_skincluster.py
          python3 -m unittest discover -s tools/btc -p 'test_validate_maya_skincluster.py' -v
          node --check racers/btc-native-hind-limb-repair.js
          node --check racers/btc-maya-master.js
          node --check racers/btc-atelier-preview.js
          node --check tests/btc-v22-16phase-qa.mjs
          node --check tests/btc-native-hind-ab.mjs
          node --test tests/btc-v12-anatomy-contract.mjs tests/btc-horse-atelier-contract.mjs tests/btc-master-change-policy.mjs tests/btc-maya-native-index-identity.mjs
      - name: Install Chromium and 3D runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 three@0.187.0
          npx playwright install chromium
      - name: Render 16 real skinned Gallop poses and six cameras
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/btc-v22-qa.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          node tests/btc-v22-16phase-qa.mjs
          node tests/btc-native-hind-ab.mjs
      - name: Finalize isolated WebGL run locator (commit status only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CONTEXT: "BTC V22 16-phase WebGL run locator"
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="$RUN_CONTEXT" \
            -f description="run_id=$GITHUB_RUN_ID; result=$JOB_STATUS" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Archive real PNGs for visual before/after inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v23-16-gallop-six-cameras
          path: |
            artifacts/btc-v22-full-cycle/**
            artifacts/btc-native-hind-ab/**
          if-no-files-found: warn
