name: BTC V18 · 16-phase real WebGL QA (candidate only)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'racers/btc-maya-native-hind-skin.js'
      - 'racers/btc-maya-pose-volume.js'
      - 'racers/btc-maya-master.js'
      - 'racers/btc-maya-groom.js'
      - 'racers/btc-atelier-preview.js'
      - 'racers/racers.js'
      - 'racers/index.html'
      - 'tests/btc-v18-*.mjs'
      - '.github/workflows/btc-v18-visual-qa.yml'
permissions:
  contents: read
jobs:
  btc-v18-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check racers/btc-maya-native-hind-skin.js
          node --check racers/btc-maya-pose-volume.js
          node --check racers/btc-maya-master.js
          node --check racers/btc-maya-groom.js
          node --check tests/btc-v18-native-hind-projection.mjs
          node --check tests/btc-v18-visual-16phase-browser.mjs
      - name: Install Three and Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 three@0.187.0
          npx playwright install chromium --with-deps
      - name: Test actual native-bone interpolation mathematics
        run: node --test tests/btc-v18-native-hind-projection.mjs
      - name: Capture genuine animated horse at 16 Gallop phases
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/btc-v18-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node tests/btc-v18-visual-16phase-browser.mjs
      - name: Upload real Chromium WebGL screenshots (NOT AAA signoff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v18-gallop-six-cameras-16-poses
          path: artifacts/btc-v18-16phase-webgl/**
          if-no-files-found: warn
