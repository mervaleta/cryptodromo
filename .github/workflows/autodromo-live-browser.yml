name: Autodromo live WebGL browser verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autodromo-live-browser.yml'
      - 'autodromo/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Test LIVE Hostinger page, data and WebGL
        env:
          URL: https://race.cryptodromo.com/autodromo/?webgl-check=20261104
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader']});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto(process.env.URL,{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(response?.status(),200,'Production route should exist');
            await page.waitForFunction(()=>window.__cryptodromoAutodromoQA?.snapshot().carCount===12||document.querySelector('#canvas-fallback')?.hidden===false,{timeout:100000});
            let state=await page.evaluate(()=>window.__cryptodromoAutodromoQA.snapshot());
            assert.equal(state.frameReady,true,'WebGL should run on Hostinger');
            assert.equal(state.carCount,12);
            assert.equal(state.rosterCount,100);
            assert.equal(state.grid.length,12,'Must expose twelve distinct pole positions');
            assert.equal(state.grid[0].row,1);
            assert.equal(state.grid[1].row,1);
            assert.equal(state.grid[1].column,1);
            assert.match(await page.locator('#pole-label').innerText(),/POLE/);
            assert.equal(await page.locator('#garage-grid .car-card').count(),100);
            assert.equal(await page.locator('#standings li').count(),12);
            await page.screenshot({path:'/tmp/autodromo-live.png'});
            await page.locator('[data-track="genesis"]').click();
            await page.waitForFunction(()=>window.__cryptodromoAutodromoQA.snapshot().trackId==='genesis');
            await page.locator('#test-race').click();
            await page.waitForTimeout(1200);
            state=await page.evaluate(()=>window.__cryptodromoAutodromoQA.snapshot());
            assert.equal(state.mode,'test');
            assert.ok(state.elapsed>0);
            assert.equal(state.carCount,12);
            assert.deepEqual(errors,[]);
            console.log('AUTODROMO_HOSTINGER_WEBGL_OK',JSON.stringify(state));
          }finally{await browser.close();}
          JS
      - name: Save public screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodromo-live-production
          path: /tmp/autodromo-live.png
          if-no-files-found: ignore
