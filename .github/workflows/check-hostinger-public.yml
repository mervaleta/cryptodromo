name: Check race.cryptodromo.com deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-hostinger-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-host:
    runs-on: ubuntu-latest
    steps:
      - name: Check current Hostinger website and production modules
        shell: bash
        run: |
          set -euo pipefail
          for url in             "https://race.cryptodromo.com/"             "https://race.cryptodromo.com/race-lab/source/src/data/officialRace.js"             "https://race.cryptodromo.com/race-lab/source/assets/horse.glb.gz"; do
            echo "::group::$url"
            printf "HTTP status: "
            curl -L --max-time 20 -sS -o /tmp/response -w "%{http_code}\n" "$url" || true
            printf "Response bytes: "; wc -c < /tmp/response || true
            if grep -qaE "createOfficialRace|CRYPTODROMO_SATOSHI_STADIUM_V1|Gran Premio" /tmp/response; then
              echo "Contains race frontend/engine marker"
            fi
            echo "::endgroup::"
          done
      - name: Inspect live fixture and game engine versions
        run: |
          echo "Public price fixture coefficient deck:"
          curl -fsSL "https://race.cryptodromo.com/race-lab/source/src/data/raceFixture.js?verify=20261102" | grep -E -m 1 'const FIRST_DECK'
          echo "Public official engine coefficient deck:"
          curl -fsSL "https://race.cryptodromo.com/race-lab/source/src/data/officialRace.js?verify=20261102" | grep -E -m 1 'FIRST_COEFFICIENTS'
