name: Alpha20 Starting Gates Contracts
on:
  pull_request:
    paths:
      - 'visual-lab/broadcastGates.js'
      - 'visual-lab/broadcastGateNumbers.js'
      - 'visual-lab/gateChoreography.js'
      - 'tests/alpha20-*.mjs'
      - '.github/workflows/alpha20-gates.yml'
  workflow_dispatch:
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test gate contracts and choreography
        run: node --test tests/alpha20-gates.mjs tests/alpha20-gate-choreography.mjs
      - name: Parse source as modules
        run: |
          cp visual-lab/broadcastGates.js /tmp/crp-broadcast-gates.mjs
          cp visual-lab/broadcastGateNumbers.js /tmp/crp-broadcast-numbers.mjs
          cp visual-lab/gateChoreography.js /tmp/crp-gate-choreography.mjs
          node --check /tmp/crp-broadcast-gates.mjs
          node --check /tmp/crp-broadcast-numbers.mjs
          node --check /tmp/crp-gate-choreography.mjs
