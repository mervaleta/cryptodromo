name: Muybridge clubhouse - geometric and visual QA
on:
  pull_request:
    paths:
      - 'visual-lab/scene.js'
      - 'visual-lab/pavilionPlacement.js'
      - 'visual-lab/satoshiPavilionDetail.js'
      - 'visual-lab/index.html'
      - 'stadiums/crypto/broadcast/index.html'
      - 'tests/muybridge-clubhouse*'
      - 'tests/satoshi-pavilion-detail.mjs'
      - '.github/workflows/muybridge-clubhouse.yml'
  push:
    branches: [main]
    paths:
      - 'visual-lab/scene.js'
      - 'visual-lab/pavilionPlacement.js'
      - 'visual-lab/index.html'
      - 'stadiums/crypto/broadcast/index.html'
      - 'tests/muybridge-clubhouse*'
      - '.github/workflows/muybridge-clubhouse.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check visual-lab/scene.js
          node --check visual-lab/pavilionPlacement.js
      - name: Verify 3 course envelopes, stands, foundations, roof and signs
        run: node --experimental-default-type=module --test tests/muybridge-clubhouse-clearance.mjs
      - name: Verify physical VIP portico, footprint, materials and GPU cleanup
        run: node --experimental-default-type=module --test tests/satoshi-pavilion-detail.mjs
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Test actual on-screen building transform on three race layouts
        env:
          CRP_BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/muybridge-clubhouse-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/muybridge-clubhouse-browser.mjs
      - name: Preserve screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muybridge-clubhouse-three-courses
          path: /tmp/muybridge-clubhouse-*.png
          if-no-files-found: ignore

  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Verify the real Hostinger scene after automatic deployment
        env:
          CRP_BASE_URL: https://race.cryptodromo.com
        run: |
          set -e
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Checking deployed VIP pavilion (attempt $attempt)..."
            if node tests/muybridge-clubhouse-browser.mjs; then
              echo "MUYBRIDGE_CLUBHOUSE_PRODUCTION_OK"
              exit 0
            fi
            sleep 12
          done
          echo "::error::Hostinger is not serving the corrected 3D pavilion"
          exit 1
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muybridge-clubhouse-hostinger
          path: /tmp/muybridge-clubhouse-*.png
          if-no-files-found: ignore
