name: LIVE · restore real gallop dust (no terrain stains)
on:
  pull_request:
    paths:
      - 'visual-lab/scene.js'
      - 'visual-lab/index.html'
      - 'stadiums/crypto/broadcast/index.html'
      - 'tests/race-dust-contract.mjs'
      - 'tests/race-dust-browser.mjs'
      - '.github/workflows/race-dust-restoration.yml'
  push:
    branches: [main]
    paths:
      - 'visual-lab/scene.js'
      - 'visual-lab/index.html'
      - 'stadiums/crypto/broadcast/index.html'
      - 'tests/race-dust-browser.mjs'
      - '.github/workflows/race-dust-restoration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax and official racing invariants
        run: |
          node --experimental-default-type=module --check visual-lab/scene.js
          node --experimental-default-type=module --check tests/race-dust-browser.mjs
          node --experimental-default-type=module --test tests/race-dust-contract.mjs tests/hoof-terrain-fx.mjs tests/official-race.mjs
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium WebGL
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Race three surfaces with visible airborne dust and no hoof stains
        env:
          CRP_DUST_BASE: http://127.0.0.1:8799
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/crp-racedust.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8799/ >/dev/null && break; sleep 1; done
          node tests/race-dust-browser.mjs
