stages:
  - test
  - publish

test:
  stage: test
  image: python:3.14
  script:
    - python3 -m unittest discover -s tests -v
    - python3 -m unittest tests/test_eaas_engine.py -v
    - python3 -m unittest tests/test_mochi_backend.py -v

pages:
  stage: publish
  image: python:3.14
  script:
    - python3 me_operator.py
  artifacts:
    paths:
      - public
  only:
    - main
